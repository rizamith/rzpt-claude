name: Sincronizar Zepp

# Corre todos os dias e traz o sono e a atividade do relogio para dados/*.csv.
#
# Secrets necessarios (Settings -> Secrets and variables -> Actions):
#   ZEPP_APP_TOKEN  \ obtidos uma vez, no PC, com:
#   ZEPP_USER_ID    /   python ferramentas/zepp_api.py --token
#
# Porque token e nao palavra-passe: o endpoint de autenticacao da Zepp e o unico
# limitado por numero de pedidos, e a partir dos IPs partilhados dos runners do
# GitHub da 429 com facilidade. Autenticando uma vez a partir de casa e guardando
# o token, o workflow so toca no endpoint de dados, que nao tem esse limite.
# Bonus: a palavra-passe nunca chega a existir na nuvem.
#
# ZEPP_EMAIL e ZEPP_PASSWORD sao alternativa de recurso, se o token faltar.

on:
  schedule:
    # 08:20 UTC = 09:20 em Portugal no verao. Depois de acordar e do relogio
    # ja ter sincronizado com o telemovel.
    - cron: '20 8 * * *'
  workflow_dispatch:
    inputs:
      dias:
        description: 'Quantos dias para tras ir buscar'
        required: false
        default: '7'

permissions:
  contents: write

concurrency:
  group: sincronizar-zepp
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Sem setup-python e sem `pip install`: o runner ja traz Python 3 e os
      # scripts usam so a biblioteca padrao.
      - name: Ambiente
        run: python3 --version

      - name: Verificar os Secrets
        env:
          ZEPP_APP_TOKEN: ${{ secrets.ZEPP_APP_TOKEN }}
          ZEPP_USER_ID: ${{ secrets.ZEPP_USER_ID }}
          ZEPP_EMAIL: ${{ secrets.ZEPP_EMAIL }}
          ZEPP_PASSWORD: ${{ secrets.ZEPP_PASSWORD }}
        run: |
          # Confirma que estao definidos, sem revelar o conteudo.
          echo "ZEPP_APP_TOKEN: ${#ZEPP_APP_TOKEN} caracteres"
          echo "ZEPP_USER_ID:   ${#ZEPP_USER_ID} caracteres"
          echo "ZEPP_EMAIL:     ${#ZEPP_EMAIL} caracteres (recurso)"
          echo "ZEPP_PASSWORD:  ${#ZEPP_PASSWORD} caracteres (recurso)"
          if [ -z "$ZEPP_APP_TOKEN" ] || [ -z "$ZEPP_USER_ID" ]; then
            echo "AVISO: sem app_token. Vai autenticar com palavra-passe e"
            echo "arrisca HTTP 429 a partir dos IPs do GitHub."
            echo "Correr no PC:  python ferramentas/zepp_api.py --token"
          fi

      - name: Buscar dados da Zepp
        env:
          ZEPP_APP_TOKEN: ${{ secrets.ZEPP_APP_TOKEN }}
          ZEPP_USER_ID: ${{ secrets.ZEPP_USER_ID }}
          ZEPP_EMAIL: ${{ secrets.ZEPP_EMAIL }}
          ZEPP_PASSWORD: ${{ secrets.ZEPP_PASSWORD }}
        run: |
          python3 ferramentas/zepp_api.py \
            --dias "${{ github.event.inputs.dias || '7' }}" \
            --importar --diag

      - name: Committar se houver novidade
        run: |
          git config user.name  "Zepp Sync"
          git config user.email "zepp-sync@users.noreply.github.com"
          if git diff --quiet -- dados/; then
            echo "Sem alteracoes."
            exit 0
          fi
          git add dados/
          git commit -m "dados: sincronizacao automatica da Zepp

          Sono e atividade trazidos pela API. Workflow sincronizar-zepp."
          # A execucao anterior pode ter ficado a meio: puxar antes de empurrar.
          git pull --rebase --autostash
          git push
